name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: lts/*
      - run: npm install
      - run: npm run lint
      # Regenerate Sanity types and fail if the checked-in generated files
      # (studio/schema.json, frontend/sanity.types.ts) are stale
      - run: npm run typegen --workspace=frontend
      - run: git diff --exit-code studio/schema.json frontend/sanity.types.ts
      - run: npm run type-check
